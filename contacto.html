<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos! Joyeria Sol Naciente</title>
    <link rel="stylesheet" href="css/estilo1.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/loguito.png" alt="Logo Joyeria">
            <h1>Joyería Sol Naciente</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="producto.html">Productos</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contacto-seccion">
            <h2>Contáctanos</h2>
            <p>¿Tenes alguna consulta especial o deseas un diseño personalizado? Escribinos.</p>
            
            <form class="formulario-contacto" method="post"><!--lo puse en post por que si lo pongo en get se muestra en la url-->
                <div class="campo-grupo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
                </div>
                <div class="campo-grupo">
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Tu numero de telefono" minlength="10" maxlength="10" required  oninput="this.value = this.value.replace(/[^0-9+]/g, '')" >
                </div>
                <!--ininput lo tuve que buscar en google por que no lo podia limitar-->
                <div class="campo-grupo">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="tucorreo@correo.com">
                </div>
                
                <div class="campo-grupo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje..."></textarea>
                </div>
                
                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Joyería Sol Naciente. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
